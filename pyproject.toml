[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "p-brainz"
dynamic = ["version"]
description = "A modular local AI gateway for Project Zomboid mods."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "google-genai>=1.0,<2.0",
    "openai>=1.68,<3.0",
    "piper-tts>=1.2,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]
build = [
    "cairosvg>=2.7,<3.0",
    "pyinstaller>=6.0,<7.0",
]

[project.scripts]
p-brainz = "pbrainz.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pbrainz"]

[tool.hatch.version]
path = "src/pbrainz/version.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
