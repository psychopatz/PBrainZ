name: Build P BrainZ release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip; python -m pip install ".[build]"
      - name: Build Windows executable
        run: python scripts/build_release.py --target exe --version "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: PBrainZ-windows
          path: dist/release/*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk runtime development files
        run: sudo apt-get update && sudo apt-get install --yes python3-tk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[build]"
      - name: Build Linux AppImage
        run: python scripts/build_release.py --target appimage --version "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: PBrainZ-linux
          path: dist/release/*.AppImage

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Remove superseded v0.1.12 release
        if: github.ref_name == 'v0.1.13'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.12 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete v0.1.12 --cleanup-tag --yes --repo "${GITHUB_REPOSITORY}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.exe
            release-assets/**/*.AppImage
